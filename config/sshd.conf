PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers dev
UseDNS no
# VS Code Remote-SSH needs local/dynamic forwarding; remote (-R) forwarding would give the container a path out.
AllowTcpForwarding local
GatewayPorts no
X11Forwarding no
PermitTunnel no
AllowAgentForwarding no
