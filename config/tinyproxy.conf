User tinyproxy
Group tinyproxy
Port 8888
Listen 127.0.0.1
Allow 127.0.0.1
Timeout 600
MaxClients 20
LogLevel Notice
LogFile "/var/log/tinyproxy/tinyproxy.log"
PidFile "/run/tinyproxy/tinyproxy.pid"
DisableViaHeader Yes
ConnectPort 443
FilterDefaultDeny Yes
FilterType ere
Filter "/etc/tinyproxy/allowlist"
